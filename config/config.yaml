#################################
##
## File configuration configuration

# Overwritten automatically by workflow/scripts/bootstrap_project.sh when
# scaffolding a new project -- edit only if setting up a project by hand.
pipeline_folder: "/users/<your-username>/holor-pipeline-fork/"

# Real, on-disk location(s) of your raw sequencing reads (comma-separated if
# more than one) -- also set automatically by bootstrap_project.sh. reads/
# in this project only holds SYMLINKS to your real files; reads__link_run
# runs inside a container and needs the real directory bind-mounted (see
# run_Kelvin.sh's BIND_PATHS) to actually read them, or it fails. Leave
# empty if you set up a project by hand and already added your reads
# directory to BIND_PATHS yourself.
raw_reads_dirs: ""

features-file: "config/features.yaml"
params-file: "config/params.yaml"
docker-file: "config/.docker.yml"
sample-file: "config/samples.tsv"
dram-config: "config/dram_config.txt"
phylophlan-config: "config/phylophlan/supertree_aa.cfg"

tmp_storage: "$TMP"
nvme_storage: "$LOCAL_SCRATCH"
shm_storage: "/dev/shm"      # If shm is not available, set to a fast disc (same as nvme_storage), if that is not available, point it to a regular disc (like tmp_storage)

copy_dbs: "True"          # If "True", dbs will be copied to faster discspaces, where applicable. Set to "False" to keep the original locations during runtime.
diamond_shm: "True"       # Set "True", if shm space should be used for diamond, if "False" nvme_storage will be used as fall back (if copy_dbs="True")
eggnog_shm: "True"       # Set "True", if shm space should be used for diamond, if "False" nvme_storage will be used as fall back (if copy_dbs="True")
kraken2_shm: "True"       # Set "True", if shm space should be used for diamond, if "False" nvme_storage will be used as fall back (if copy_dbs="True")

assembler: "metaspades"  # "metaspades", "megahit" or e.g. "provided". Megahit serves as fall-back in case metaspades cannot create the assemblies. With any other folder name the pipeline expects self-provided assemblies in results/assemble/<name>/<assembly>.fa.gz .


#################################
##
## Resource limitations (to limit project-wide the parallel execution of certain rules)

metaspades_slots: 10

#################################
##
## Server configuration

resource_sets:
  small:
    runtime: 300
    mem_mb: 16000
    cpus: 1
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  medium:
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  medium_nvme:
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:10"

  large:
    runtime: 4000
    mem_mb: 320000
    cpus: 20
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  large_nvme:
    runtime: 4000
    mem_mb: 320000
    cpus: 20
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:50"

  highmem:
    runtime: 4000
    mem_mb: 1400000
    cpus: 20
    partition: "k2-himem,k2-lowpri,k2-bioinf"
    nvme: "nvme:250"

  # Real evidence (2026-09-25), gathered via the k2-bioinf partition-wide
  # sacct collector (~/bin/collect_k2bioinf.sh), not this pipeline's own
  # benchmark: data -- no metaspades run has ever completed successfully
  # inside this pipeline yet. Real recent attempts at 280G (32 cpus)
  # FAILED, peak RSS landing right up against the 280G ceiling on several
  # samples (up to 262.8GB) -- looks like OOM, not an unrelated crash.
  # Meanwhile a different user's real metaspades runs (20 cpus, requesting
  # 300G) completed successfully, peak RSS 205-220GB, real wall-clock
  # 12-20h. Different dataset, so not a guarantee, but real evidence 300G
  # has headroom where 280G didn't, and this fork's own samples aren't
  # bigger than what typically failed at 280G either. Routes through
  # k2-himem (with k2-lowpri/k2-bioinf fallback, matching highmem's own
  # partition list) since that's the only Kelvin partition intended for
  # requests this size -- not because 4000min is expected to be needed:
  # real completions elsewhere took well under a day.
  kelvin_metaspades_himem:
    runtime: 4000
    mem_mb: 300000
    cpus: 20
    partition: "k2-himem,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  longrun:
    runtime: 20000
    mem_mb: 320000
    cpus: 20
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:250"

  highmem_longrun:
    # Confirmed directly (2026-09-14) via `sinfo -p k2-himem` and a real
    # `sbatch --test-only`: k2-himem's real MaxTime is 3-00:00:00 (4320min),
    # not the generic 20000min this tier inherited from Migale/Puhti, and no
    # other Kelvin partition has anywhere near 1.4TB/node (k2-lowpri tops out
    # at 772992MB, k2-bioinf at 1030144MB) to fall back to for this much
    # memory. 20000min/k2-himem together is unsatisfiable on this cluster --
    # confirmed the hard way: SLURM rejects the whole submission ("Requested
    # time limit is invalid"), the same multi-partition --time behaviour
    # documented in config/profiles/Kelvin/config.yaml. Capped to k2-himem's
    # actual ceiling; no rule currently uses this tier (grep config/
    # escalation.yaml) so nothing was silently broken, but don't raise this
    # runtime again without re-confirming k2-himem's cap.
    runtime: 4320
    mem_mb: 1400000
    cpus: 20
    partition: "k2-himem"
    nvme: "nvme:250"

  full_node:
    runtime: 4000
    mem_mb: 360000
    cpus: 40
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:1000"

  # --- Kelvin2-specific, real-data-calibrated tiers (holor-pipeline-fork) ---
  # Added for the preprocess bowtie2/fastp cascade: real benchmark data (sample
  # 37131, benchmark: TSVs) shows these rules complete in 15-76min at <=38GB,
  # nowhere near the "medium" tier's 4000min/160GB they previously inherited --
  # that mismatch was the original queueing problem (excluded from k2-medpri's
  # 24h cap, forced onto contended k2-lowpri/k2-bioinf for no real reason).
  # Sized with generous headroom over the observed max, not an exact fit.
  kelvin_preprocess_std:      # fastp__run, bowtie2__build
    runtime: 180         # 3h vs. real max 76min (fastp)
    mem_mb: 16000         # 16GB vs. real max 12.0GB (bowtie2 build)
    cpus: 4
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  kelvin_preprocess_map:      # bowtie2__map (heaviest preprocess stage)
    runtime: 180          # 3h vs. real max 44min
    # Single tier only, real-data headroom bumped up from 49000 -- this rule is
    # part of the "preprocess_{sample}_{library}" group (see rules/preprocess/
    # {fastp,bowtie2}.smk), and a real, reproduced test (2026-09-15, toy
    # group+retries repro under /mnt/scratch2/users/3053301/group_retry_toy)
    # confirmed retries: inside an already-running group allocation cannot
    # actually get more resources -- the retry just re-executes inside the
    # SAME fixed SLURM job, silently ignoring any larger attempt-2 request.
    # This rule previously escalated "kelvin_preprocess_map,large" -- a no-op
    # once grouped, and load-bearing on nothing since the escalation never
    # takes effect. Sized generously up front instead; do not re-add a second
    # escalation tier here while this rule stays grouped.
    mem_mb: 64000          # ~63GB vs. real max 38.1GB (was 49000)
    cpus: 8
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  # Real root cause found 2026-09-15 by reproducing the constructed sbatch
  # call by hand (see preprocess_37131_lib1 group failures): a Snakemake
  # `group:` job's total requested runtime is the SUM of its member rules'
  # individual runtimes (9 sequential rules in the preprocess group), and
  # `preprocess__bowtie2__extract_nonhost_run`/`preprocess__store_final_fastq`
  # were both on the shared `small` tier (300min each) -- generous and
  # correct for an INDIVIDUAL submission, but summed across the whole group
  # (180 fastp + 4x180 map + 4x300 extract + 300 finalize = 2400min) it
  # exceeded k2-medpri's real 1440min (24h) cap, and SLURM rejects the
  # *entire* multi-partition submission if --time exceeds ANY listed
  # partition's cap (the same root bug this whole fork exists to fix,
  # recurring one layer up at the group level). Confirmed via
  # `sbatch --parsable ... -t 2400 -p k2-medpri,k2-lowpri,k2-bioinf` run by
  # hand: "Requested time limit is invalid (missing or exceeds some limit)".
  # `small` is shared by ~35 other, ungrouped rules where this doesn't apply
  # (each submits individually) -- do not edit it; these two dedicated tiers
  # exist so the grouped rules can be sized tightly without touching it.
  kelvin_preprocess_extract:  # bowtie2__extract_nonhost_run (grouped, x4 hosts)
    runtime: 100          # real max 51min -- ~2x headroom
    mem_mb: 16000          # unchanged from `small`, not the bottleneck here
    cpus: 1
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  kelvin_preprocess_finalize:  # store_final_fastq (grouped): 2x cp + 2x mv only
    runtime: 30          # no direct real benchmark yet for this exact rule
                          # (new in this fork vs. the old install) -- generous
                          # given it's copying already-produced, already-
                          # decontaminated fastq.gz files; revisit with real
                          # data once captured.
    mem_mb: 16000
    cpus: 1
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  # Same bug, same fix pattern, caught before ever running for real this time:
  # a dry run against the "assemble"/"mag_annotate"/"quantify" targets
  # (2026-09-18) raised, immediately at DAG-build time rather than silently at
  # submission:
  #   WorkflowError: Error grouping resources in group 'magscot_37131':
  #   Resource slurm_partition is a string but not all group jobs require the
  #   same value. Observed values: {'k2-lowpri,k2-bioinf',
  #   'k2-medpri,k2-lowpri,k2-bioinf'}.
  # The "magscot_{assembly_id}" group (assemble/magscot.smk, 8 rules) mixes
  # `medium`/`medium_nvme` (prodigal, hmmsearch_pfam, hmmsearch_tigr --
  # partition "k2-lowpri,k2-bioinf", deliberately excluding k2-medpri since
  # their own 4000min runtime already exceeds its cap on its own) with
  # `small` (join_hmms, merge_contig_to_bin, run, reformat, rename --
  # partition "k2-medpri,k2-lowpri,k2-bioinf"). A group job is one sbatch
  # submission needing one partition list; Snakemake has no way to combine
  # two different partition strings across group members, so it refuses
  # outright rather than guessing. Explicit choice: keep all 8 rules in one
  # group (not splitting the short ones out to submit individually, which
  # would reintroduce the exact per-rule queue-wait problem this whole fork
  # exists to fix) by giving these 5 rules their own tier that matches
  # medium/medium_nvme's partition instead. `small` itself is untouched (~35
  # other, ungrouped rules use it, where k2-medpri genuinely helps).
  #
  # NOTE: runtime/mem/cpu values below are still the generic, un-recalibrated
  # `small` defaults -- no real benchmark data exists yet for magscot (only
  # `preprocess` has been calibrated with real Kelvin numbers so far). This
  # fixes the structural partition conflict; revisit the actual runtime/mem
  # values with real data once magscot has been run for real.
  #
  # Same conflict, second resource: the dry run above got past slurm_partition
  # only to immediately hit the identical failure on `gres` --
  # `assemble__magscot__prodigal` uses `medium_nvme` (nvme:10) while the rest
  # of the group used `nvme:0`. Fix: prodigal's real NVMe need is presumably
  # genuine (that's why medium_nvme exists as a distinct tier from medium in
  # the first place), so match it here rather than drop it -- this
  # over-reserves NVMe scratch for the 4 rules in this tier that likely don't
  # need it, a real inefficiency, not a correctness problem; revisit once
  # magscot has real benchmark data. hmmsearch_pfam/hmmsearch_tigr's fix is
  # simpler: they only need medium's numbers, so just point them at the
  # already-existing medium_nvme instead of medium (see escalation.yaml) --
  # no new tier needed there.
  kelvin_magscot_small:  # join_hmms, merge_contig_to_bin, run, reformat, rename
    runtime: 300
    mem_mb: 16000
    cpus: 1
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  # Regression found and fixed 2026-09-20: the gres fix above (nvme:10 ->
  # nvme:0, commit b260899 -- Kelvin2 has no real "nvme" gres type at all)
  # changed kelvin_magscot_small's own nvme value but left prodigal/
  # hmmsearch_pfam/hmmsearch_tigr on the shared `medium_nvme` tier, which
  # still carries nvme:10 (medium_nvme was explicitly flagged, not fixed,
  # in that same commit -- shared by ~15 other rules, wider blast radius).
  # That recreated the exact group-consistency conflict already fixed once
  # before, just from the other direction: confirmed via a real dry run
  # against `mag_annotate` (which pulls magscot in as a dependency, same
  # as any other target that needs it) --
  #   Error grouping resources in group 'magscot_37131': Resource gres is
  #   a string but not all group jobs require the same value. Observed
  #   values: {'nvme:10', 'nvme:0'}.
  # Same fix pattern as kelvin_magscot_small itself: a dedicated tier
  # mirroring medium_nvme's real values but with nvme:0, so every rule in
  # this group agrees again. Do not point these three back at medium_nvme
  # while they stay grouped.
  kelvin_magscot_medium:  # prodigal, hmmsearch_pfam, hmmsearch_tigr
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  # --- read_annotate tools (2026-09-19) ---
  # First real attempt at read_annotate for this fork. Unlike preprocess,
  # there's no real benchmark data yet -- these are evidence-based estimates
  # from each tool's own documentation/community-reported figures, cross-
  # checked against this pipeline's real config (no diamond --block-size
  # override -> uses diamond's own default; kraken2's real 189GB database;
  # our real sample's real read counts from its own fastp report), NOT
  # blind "database size" guesses. Confidence varies per tool -- see the
  # per-tier comments. Revisit all of these with real benchmark: data once
  # this actually runs; treat these as a deliberately low starting point to
  # try, same spirit as every other tier in this file.
  #
  # k2-hipri is real (confirmed via sinfo, not assumed): 180min cap, same
  # big-memory node pool as medpri/lowpri/bioinf. Included only for tools
  # with real evidence their runtime fits comfortably under that -- SLURM
  # rejects the whole submission if --time exceeds ANY listed partition's
  # cap, so getting this wrong for a tool that's genuinely slow would break
  # its submission outright, not just miss out on the faster queue.

  kelvin_read_kraken2:  # kraken2__assign -- real DB 189GB, staged into /dev/shm
    runtime: 170          # classification itself is very fast (>93M reads/min
                          # per Kraken2's own paper); real bottleneck is
                          # copying the 189GB DB into /dev/shm first. Included
                          # on hipri with real but accepted risk on DB-staging
                          # I/O time -- untested, first real attempt.
    mem_mb: 210000        # real DB size (189GB) + ~10% overhead
    cpus: 16              # matches the throughput figure's own thread count
    partition: "k2-hipri,k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"  # was nvme:200 -- Kelvin2 has no real "nvme" gres type
                          # (`scontrol show config`: GresTypes = gpu only;
                          # every node in these partitions shows GRES=(null)).
                          # Found for real 2026-09-19: any nonzero nvme:N
                          # value fails real sbatch submission outright
                          # ("Invalid generic resource (gres) specification").
                          # nvme:0 is accepted only because requesting zero
                          # of anything skips validation. See the same fix on
                          # kelvin_magscot_small; medium/medium_nvme/full_node/
                          # highmem/large_nvme/longrun/highmem_longrun still
                          # carry nonzero nvme values and are equally broken
                          # for real submission -- not fixed here (shared,
                          # wider blast radius), flagged as a real follow-up.

  kelvin_read_diamond:  # diamond__assign -- real DB (cazy) only 1.8GB
    # Real evidence correction (2026-09-19): job 9937380 died with a real
    # OOM kill ("diamond blastx ... Killed") after 2m53s at 16GB. The
    # --block-size formula only covers the TARGET database's memory need --
    # it says nothing about buffering the QUERY file, and this rule's query
    # is one full read direction of a real 171M-read sample (~11GB
    # compressed R1 alone), run per-thread (cpus: 4). Bumped substantially
    # rather than guess a precise number a second time; still well under
    # the original 160GB default. Revisit once it actually succeeds.
    # Second real evidence correction: with the OOM fixed, job 9939587 ran
    # cleanly for the full 90min budget and hit TIMEOUT -- same pattern as
    # metaphlan/singlem's original underestimates. Real time for aligning
    # a full 171M-read direction, even against a small 1.8GB target DB, is
    # genuinely more than 90min. Bumped past what phyloflash/metaphlan
    # actually needed for real (75-205min) and dropped from k2-hipri.
    runtime: 300
    mem_mb: 64000
    cpus: 4
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"  # no real nvme gres on Kelvin2, see kelvin_read_kraken2

  kelvin_read_humann:  # humann__run -- NOT a hipri candidate, real evidence
    # Real evidence correction (2026-09-20): job 9939585 hit a real, confirmed
    # OOM ("Detected 2 oom_kill events... Out Of Memory") after 3h31m, well
    # within the then-900min runtime budget. 32GB (chosen as "above typical
    # peak, below worst case") wasn't enough -- this real sample falls into
    # the documented "larger-DB" heavy category, not the 20-25GB typical
    # case. Bumped toward the documented ~72GB worst case rather than a
    # small increment.
    #
    # Second real evidence correction (2026-09-21): with the OOM fixed, job
    # 9939973 ran the full 900min (15h) and hit TIMEOUT, not OOM. Its own
    # log shows why: nucleotide alignment finished in ~52min (98.7% of reads
    # unaligned, as expected), then the translated-search `diamond blastx`
    # step against uniref90_201901b_full started and was STILL running when
    # killed 13.5+ hours later. The 900min figure came from the HUMAnN3
    # paper's community-reported average (52.5+/-19.2 CPU-hours / 10 cpus ~=
    # 5.25h) -- wrong for this real sample; translated search alone already
    # exceeded that by 2.5x before being cut off. Bumped hard to get a real
    # completion time rather than guess again. k2-medpri (1440min/24h cap)
    # dropped from the partition list -- this runtime now exceeds it, and
    # listing it anyway would trigger the multi-partition --time rejection
    # this whole fork exists to fix.
    #
    # Real completion confirmed (2026-09-23): job 9972787 finished
    # successfully on attempt 1 -- rule's own log shows "Finished rule
    # read_annotate__humann__run" with all 3 real output files created.
    # Total wall-clock: 1d09h09m56s (~1990min), comfortably inside the
    # 2880min budget (~15h of margin). Real number now known; not tightened
    # further since k2-lowpri/bioinf are uncapped (no queue-cost benefit to
    # shrinking it) and this is still only one sample's data point.
    runtime: 2880          # 48h -- confirmed real completion at ~1990min
                          # (see above); k2-lowpri/bioinf are uncapped so
                          # the headroom costs nothing
    mem_mb: 80000
    cpus: 10
    partition: "k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  kelvin_read_metaphlan:  # metaphlan__run
    # Real evidence beats my earlier guess: job 9936992 (real run, sample
    # 37131, 2026-09-19) hit TIMEOUT at exactly 120min, the runtime this
    # tier originally requested. The "typically fast" assumption was wrong
    # for this sample. Bumped to 400min and pulled off k2-hipri (confirmed
    # NOT a fits-under-180min candidate); the relaunch (job 9937377) then
    # genuinely COMPLETED in 3h25m10s (205min) -- real number now known,
    # comfortably under 400min. Could be tightened closer to ~250min with
    # real headroom once a second sample confirms this isn't a fluke;
    # left generous for now.
    runtime: 400
    mem_mb: 25000          # docs: 15GB (v4.0) vs 25GB (v4.1) minimum; exact
                          # version unconfirmed (no dedicated container tag
                          # found), used the safer/larger figure -- memory
                          # wasn't the failure mode, left as-is
    cpus: 4
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  kelvin_read_phyloflash:  # phyloflash__run
    # Real evidence correction (2026-09-19): job 9937379 hit a real,
    # confirmed OOM ("Detected 2 oom_kill events... Out Of Memory") after
    # 8m51s -- well within the 150min runtime budget, so only memory was
    # short. Its own log shows why: phyloFlash invokes bbmap internally
    # with -Xmx20g (its own hardcoded/auto-detected Java heap), which
    # alone exceeds the 16GB this tier gave it, before even reaching the
    # internal SPAdes assembly stage afterward. Bumped substantially;
    # runtime evidence (8m51s, real OOM well before any time pressure)
    # doesn't invalidate the "under an hour" documentation, so left on
    # hipri.
    runtime: 150
    mem_mb: 48000
    cpus: 4
    partition: "k2-hipri,k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"  # was nvme:10 -- no real nvme gres on Kelvin2, see kelvin_read_kraken2

  kelvin_read_singlem:  # singlem__pipe
    # Real evidence correction (2026-09-19): job 9937378 hit TIMEOUT at
    # exactly 120min -- same pattern as metaphlan's original underestimate.
    # Our real sample (~89Gbp) sits right at the edge of SingleM's own
    # documented "light usage" threshold (>100Gbp), and evidently that
    # edge case runs longer than the docs' light-usage framing implied.
    # Bumped well past what metaphlan (a comparable marker/alignment-based
    # tool) actually needed for real (205min) rather than guess again;
    # dropped from hipri given two of these "should be fast" tools have
    # now both underrun their real time on this sample.
    runtime: 300
    mem_mb: 8000           # memory wasn't implicated in the failure, left as-is
    cpus: 4
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"  # no real nvme gres on Kelvin2, see kelvin_read_kraken2

  kelvin_read_nonpareil:  # nonpareil__run -- NOT a hipri candidate
    runtime: 300           # docs: runtime scales LINEARLY with dataset size,
                          # no absolute anchor point given to compute
                          # against -- our real sample (171M reads, R1) is
                          # large, so deliberately not risking the 180min cap
    mem_mb: 24000          # real, computed from nonpareil's own documented
                          # formula: RAM(GB) ~= 0.1 x (reads in millions) + 2,
                          # using the real post-decontamination R1 read count
                          # (171,055,183, cross-checked against metaspades's
                          # own log) -> ~19.1GB + margin
    cpus: 4
    partition: "k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

  kelvin_read_krona:  # krona__visualize -- visualization only, no real DB
    runtime: 30            # not doc-verified (didn't find/check documentation
                          # for this one) -- low confidence, but it only
                          # renders an HTML chart from an already-computed,
                          # small taxonomy summary
    mem_mb: 8000
    cpus: 1
    partition: "k2-hipri,k2-medpri,k2-lowpri,k2-bioinf"
    nvme: "nvme:0"

 # The previous node is used for setting up a ramdisc for time-critical tasks. Make sure, that the allocation ensures that the entire node is
 # requested for the job so that there won't be other users on the same node while the job runs. Their jobs might get affected by the
 # /dev/shm access that is happening for rules using this resource_set!
 # In case you do not want to (or cannot) use /dev/shm please define a different file path in config/config.yaml under "shm_storage"
